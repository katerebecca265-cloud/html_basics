<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: 'Gill Sans', sans-serif;

        }

        table {
            width: 63%;
            border: 1px solid #000000;
            margin: auto;
            border-collapse: collapse;
            /*merge borders*/
        }

        th {
            color: #6d1919;
            border: 1px solid #000000;
            padding: 12px 6px;
            text-align: left;
            background-color: #d3d3d3;
        }

        td {
            color: #020213;
            border: 1px solid #000000;
            padding: 12px 6px;
            text-align: left;
        }

        .salary{
            color: green;
            font-weight: bold;
        }

        /* CSS Framework -- Bootstrap */
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Jane</td>
                <td>Mwangi</td>
                <td>Nairobi</td>
                <td>21</td>
                <td class="salary">60,000</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Doe</td>
                <td>Mombasa</td>
                <td>25</td>
                <td class="salary">80,000</td>
            </tr>
            <tr>
                <td>Mary</td>
                <td>Smith</td>
                <td>Kisumu</td>
                <td>30</td>
                <td class="salary">100,000</td>
            </tr>
            <tr>
                <td>James</td>
                <td>Johnson</td>
                <td>Nakuru</td>
                <td>28</td>
                <td class="salary">90,000</td>
            </tr>
            <tr>
                <td>Linda</td>
                <td>Williams</td>
                <td>Eldoret</td>
                <td>35</td>
                <td class="salary">120,000</td>
            </tr>
        </tbody>
    </table>

    <!-- List Unordered -->
    <ul>
        <li>Nairobi</li>
        <li>Mombasa</li>
        <li>Kisumu</li>
        <li>Nakuru</li>
        <li>Eldoret</li>
    </ul>

</body>

</html>
